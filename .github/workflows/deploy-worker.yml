name: Deploy Cloudflare Worker
on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare token
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Cloudflare Worker ej kopplad ännu" >> "$GITHUB_STEP_SUMMARY"
            echo "Lägg till secret \`CLOUDFLARE_API_TOKEN\` under Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker with Wrangler
        id: deploy
        if: steps.check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
      - name: Print Worker URL
        if: steps.check.outputs.enabled == 'true'
        run: |
          echo "WORKER_URL=${{ steps.deploy.outputs.deployment-url }}"
          echo "### Deployed Worker URL" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.deploy.outputs.deployment-url }}\`" >> "$GITHUB_STEP_SUMMARY"
