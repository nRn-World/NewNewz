name: Deploy Cloudflare Worker
on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'worker/**'
      - 'src/topicRules.ts' # bundled into the Worker
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare token & provision SUBS_KV
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          ACCT_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty' || true)
          if [ -z "$ACCT_ID" ]; then
            ACCT_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/memberships?per_page=5" | jq -r '.result[0].account.id // empty' || true)
          fi
          if [ -n "$ACCT_ID" ]; then
            KV_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title == "newzlocal-subs") | .id' | head -n 1 || true)
            if [ -z "$KV_ID" ]; then
              KV_ID=$(curl -sf -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"title":"newzlocal-subs"}' "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/storage/kv/namespaces" | jq -r '.result.id // empty' || true)
            fi
            if [ -n "$KV_ID" ]; then
              printf '\n[[kv_namespaces]]\nbinding = "SUBS_KV"\nid = "%s"\n' "$KV_ID" >> worker/wrangler.toml
              echo "::notice title=SUBS_KV::Provisioned and attached SUBS_KV namespace"
            else
              echo "::warning title=SUBS_KV::Could not provision SUBS_KV namespace (check Workers KV Storage Write permission)"
            fi
            D1_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/d1/database?per_page=100" | jq -r '.result[]? | select(.name == "newzlocal-db") | .uuid' | head -n 1 || true)
            if [ -z "$D1_ID" ]; then
              D1_ID=$(curl -sf -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"name":"newzlocal-db"}' "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/d1/database" | jq -r '.result.uuid // empty' || true)
            fi
            if [ -n "$D1_ID" ]; then
              printf '\n[[d1_databases]]\nbinding = "SUBS_DB"\ndatabase_name = "newzlocal-db"\ndatabase_id = "%s"\n' "$D1_ID" >> worker/wrangler.toml
              echo "::notice title=SUBS_DB::Provisioned and attached SUBS_DB D1 database"
            fi
          fi
      - name: Deploy Worker with Wrangler
        id: deploy
        if: steps.check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
      - name: Print Worker URL
        if: steps.check.outputs.enabled == 'true'
        run: |
          echo "::notice title=WorkerURL::${{ steps.deploy.outputs.deployment-url }}"
          echo "### Deployed Worker URL" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.deploy.outputs.deployment-url }}\`" >> "$GITHUB_STEP_SUMMARY"
