name: CI & Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare token & provision SUBS_KV
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          ACCT_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty' || true)
          if [ -z "$ACCT_ID" ]; then
            ACCT_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/memberships?per_page=5" | jq -r '.result[0].account.id // empty' || true)
          fi
          if [ -n "$ACCT_ID" ]; then
            KV_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title == "newzlocal-subs") | .id' | head -n 1 || true)
            if [ -z "$KV_ID" ]; then
              KV_ID=$(curl -sf -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"title":"newzlocal-subs"}' "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/storage/kv/namespaces" | jq -r '.result.id // empty' || true)
            fi
            if [ -n "$KV_ID" ]; then
              printf '\n[[kv_namespaces]]\nbinding = "SUBS_KV"\nid = "%s"\n' "$KV_ID" >> worker/wrangler.toml
              echo "Provisioned and attached SUBS_KV namespace"
            else
              echo "Warning: could not provision SUBS_KV namespace (check Workers KV Storage Write permission)"
            fi
            D1_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/d1/database?per_page=100" | jq -r '.result[]? | select(.name == "newzlocal-db") | .uuid' | head -n 1 || true)
            if [ -z "$D1_ID" ]; then
              D1_ID=$(curl -sf -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"name":"newzlocal-db"}' "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/d1/database" | jq -r '.result.uuid // empty' || true)
            fi
            if [ -n "$D1_ID" ]; then
              printf '\n[[d1_databases]]\nbinding = "SUBS_DB"\ndatabase_name = "newzlocal-db"\ndatabase_id = "%s"\n' "$D1_ID" >> worker/wrangler.toml
              echo "Provisioned and attached SUBS_DB D1 database"
            fi
          fi
      - name: Deploy Cloudflare Worker
        id: deploy
        if: steps.check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

  build:
    needs: [worker]
    if: always() && (needs.worker.result == 'success' || needs.worker.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL || vars.VITE_API_URL || needs.worker.outputs.worker_url }}
          VITE_GN_URL: ${{ vars.VITE_GN_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - name: Build & sign Android APK (NewzLocal.apk)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS_B64="$SECRET_KS_B64"
          if [ -z "$KS_B64" ] && [ -n "$CF_TOKEN" ]; then
            ACCT_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty' || true)
            if [ -z "$ACCT_ID" ]; then
              ACCT_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/memberships?per_page=5" | jq -r '.result[0].account.id // empty' || true)
            fi
            if [ -n "$ACCT_ID" ]; then
              KV_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title == "newzlocal-subs") | .id' | head -n 1 || true)
              if [ -n "$KV_ID" ]; then
                EXISTING=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/storage/kv/namespaces/$KV_ID/values/android_keystore_p12_b64" || true)
                if [ -n "$EXISTING" ]; then
                  KS_B64="$EXISTING"
                  echo "Loaded persistent Android APK keystore from SUBS_KV"
                else
                  TMP_P12=$(mktemp -u).p12
                  keytool -genkeypair -keystore "$TMP_P12" -storetype PKCS12 -storepass newzlocal -keypass newzlocal -alias newzlocal -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=NewzLocal, O=nRn World, C=SE"
                  KS_B64=$(base64 -w 0 "$TMP_P12")
                  rm -f "$TMP_P12"
                  curl -sf -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: text/plain" --data "$KS_B64" "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/storage/kv/namespaces/$KV_ID/values/android_keystore_p12_b64" >/dev/null || true
                  echo "Created and stored persistent Android APK keystore in SUBS_KV"
                fi
              fi
            fi
          fi
          ANDROID_KEYSTORE_B64="$KS_B64" bash android/build-apk.sh dist
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published site is reachable
        env:
          SITE_URL: ${{ needs.build.outputs.base_url }}
        run: |
          base="${SITE_URL%/}"
          if [ -z "$base" ]; then
            echo "::error title=Pages URL unknown::actions/configure-pages did not return a base URL, so the Pages site is not configured for this repository."
            exit 1
          fi
          status="000"
          for _ in $(seq 1 12); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$base/" || true)
            [ "$status" = "200" ] && break
            sleep 10
          done
          manifest=$(curl -sS -o /dev/null -w '%{http_code}' "$base/manifest.webmanifest" || true)
          echo "GET $base/ -> $status"
          echo "GET $base/manifest.webmanifest -> $manifest"
          if [ "$status" != "200" ] || [ "$manifest" != "200" ]; then
            echo "::error title=Published site not reachable::$base/ returned HTTP $status (manifest: HTTP $manifest) after deployment. Check Settings -> Pages: Source must be 'GitHub Actions' and this repository must not carry a custom domain that shadows the project site."
            exit 1
          fi
